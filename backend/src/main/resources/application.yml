# Вся конфигурация — через env с дефолтом под dev (bootRun с хоста).
# В контейнере docker-compose переопределяет SPRING_DATASOURCE_URL на db:5432.
server:
  port: ${PORT:8080}                        # Railway пробрасывает свой PORT

spring:
  application:
    name: hackalem-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hackalem}
    username: ${SPRING_DATASOURCE_USERNAME:hackalem}
    password: ${SPRING_DATASOURCE_PASSWORD:hackalem}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:2000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                    # схему ведёт Flyway, Hibernate только сверяет
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    openai:
      # Нет ключа → падаем на старте с понятной ошибкой. Заполни OPENAI_API_KEY в .env.
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-min-32-chars-long}
    ttl-minutes: ${JWT_TTL_MINUTES:1440}
  admin:
    # Пустое значение = админские endpoints выключены (503), а не открыты всем.
    # Временный механизм до AUTH-01: заголовок X-Admin-Token.
    token: ${ADMIN_API_TOKEN:}
  catalog:
    embedding:
      # live — реальная модель (нужен ключ), fake — детерминированные векторы
      # для offline и тестов. Пространства векторов не смешиваются: поиск сверяет
      # vector_space активной версии с текущим провайдером.
      mode: ${CATALOG_EMBEDDING_MODE:live}
      batch-size: ${CATALOG_EMBEDDING_BATCH_SIZE:64}
      # Соответствует колонке vector(1536) из V2/V3. Другая размерность — новая миграция.
      dimensions: 1536
    seed:
      # Идемпотентная загрузка синтетического каталога на старте.
      enabled: ${CATALOG_SEED_ENABLED:true}
      # Путь для bootRun с хоста; в контейнере data/ монтируется в /app/data.
      location: ${CATALOG_SEED_LOCATION:file:../data/sample_catalog/products.json}
    retained-versions: ${CATALOG_RETAINED_VERSIONS:3}
    import-queue-capacity: ${CATALOG_IMPORT_QUEUE_CAPACITY:8}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

logging:
  level:
    com.hackalem: DEBUG
