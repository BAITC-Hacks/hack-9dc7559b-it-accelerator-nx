# HackAlem AI — локальное окружение.
#
#   docker compose up -d                          # только БД (дефолт для dev)
#   docker compose --profile full up -d --build   # БД + backend + frontend
#   docker compose down -v                        # полный ресет (стирает данные!)
#
# Контракт сервисов описан в AGENTS.md. Имя сервиса = DNS-хост внутри сети:
# из контейнера БД доступна как db:5432, с хоста — как localhost:5432.

name: hackalem

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hackalem-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hackalem}
      POSTGRES_USER: ${POSTGRES_USER:-hackalem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackalem}
    ports:
      # Порт хоста вынесен в env: занят локальным Postgres → POSTGRES_PORT=5433 в .env
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # От этого healthcheck зависит старт backend — иначе Flyway падает в гонке с БД
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hackalem} -d ${POSTGRES_DB:-hackalem}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    profiles: ["full"]
    build:
      context: ./backend
    image: hackalem-backend
    container_name: hackalem-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Внутри compose-сети хост БД — всегда db. Значение из .env здесь намеренно
      # НЕ используется: .env хранит host-вариант (localhost) для ./gradlew bootRun.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-hackalem}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-hackalem}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-hackalem}
      # Не задан → приложение упадёт на старте с понятной ошибкой. Заполни .env.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-30}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-5}
      DB_POOL_CONNECTION_TIMEOUT_MS: ${DB_POOL_CONNECTION_TIMEOUT_MS:-2000}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-min-32-chars-long}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-1440}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      PORT: "8080"
      # ─── Каталог (CAT-01) ───────────────────────────────────────────────
      # Пустой токен выключает /api/admin/**, а не открывает их.
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      CATALOG_EMBEDDING_MODE: ${CATALOG_EMBEDDING_MODE:-live}
      CATALOG_EMBEDDING_BATCH_SIZE: ${CATALOG_EMBEDDING_BATCH_SIZE:-64}
      CATALOG_SEED_ENABLED: ${CATALOG_SEED_ENABLED:-true}
      # Путь внутри контейнера: data/ примонтирована ниже, значение с хоста
      # (../data/...) здесь намеренно не используется.
      CATALOG_SEED_LOCATION: file:/app/data/sample_catalog/products.json
      CATALOG_RETAINED_VERSIONS: ${CATALOG_RETAINED_VERSIONS:-3}
      CATALOG_IMPORT_QUEUE_CAPACITY: ${CATALOG_IMPORT_QUEUE_CAPACITY:-8}
    volumes:
      # Синтетический каталог не копируется в образ: build context — ./backend.
      # Монтируем только на чтение, чтобы seed видел тот же файл, что и валидатор.
      - ./data:/app/data:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      args:
        # VITE_* — переменные времени СБОРКИ, они запекаются в бандл.
        # Поменял значение → docker compose up -d --build frontend (рестарта мало).
        # Это адрес ИЗ БРАУЗЕРА: http://backend:8080 здесь не работает.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    image: hackalem-frontend
    container_name: hackalem-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
