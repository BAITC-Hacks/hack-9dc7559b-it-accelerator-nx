# Isolated D1 integration dependencies; never touches the shared demo volume.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hackalem
      POSTGRES_USER: hackalem
      POSTGRES_PASSWORD: hackalem
    ports: ["${POSTGRES_PORT:-55432}:5432"]
    volumes: ["d1pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackalem -d hackalem"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["${REDIS_PORT:-56379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  d1pg:
