server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA-роутинг: любой неизвестный путь отдаём index.html,
    # иначе прямой заход/рефреш на /items/42 вернёт 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ассеты Vite содержат хеш в имени — можно кешировать навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
}
