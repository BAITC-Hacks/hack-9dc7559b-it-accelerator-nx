server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Allowlist of pages that may embed /widget. Runtime via EMBED_FRAME_ANCESTORS.
    # Do not set X-Frame-Options here — it would override frame-ancestors.
    add_header Content-Security-Policy "frame-ancestors ${EMBED_FRAME_ANCESTORS};" always;

    # SPA routing: $$ escapes envsubst so nginx still sees $uri.
    location / {
        try_files $$uri $$uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "frame-ancestors ${EMBED_FRAME_ANCESTORS};" always;
    }

    # Versioned embed loader — short cache so hosts pick up fixes without busting forever.
    location /embed/ {
        expires 1h;
        add_header Cache-Control "public";
        add_header Content-Security-Policy "frame-ancestors ${EMBED_FRAME_ANCESTORS};" always;
        try_files $$uri =404;
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
}
